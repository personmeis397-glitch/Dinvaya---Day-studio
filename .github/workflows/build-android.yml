name: Build Android app

# Press "Run workflow" in the Actions tab to build the APK.
# bundled = your index.html is packed inside the app (needs a rebuild for every change)
# live    = the app opens your website (updates need no rebuild)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bundled (recommended) or live"
        type: choice
        options:
          - bundled
          - live
        default: bundled

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      MODE: ${{ inputs.mode || 'bundled' }}
    steps:
      - name: Get your files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        run: |
          mkdir -p app/www
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          if [ "$MODE" = "bundled" ]; then
            cp ../index.html www/index.html
          else
            echo '<!doctype html><title>Dinvaya</title>' > www/index.html
          fi
          node -e '
            const live = process.env.MODE === "live";
            const c = {
              appId: "com.dinvaya.daystudio",
              appName: "Dinvaya Day Studio",
              webDir: "www",
              plugins: { LocalNotifications: { smallIcon: "ic_stat_dinvaya" } }
            };
            if (live) c.server = { url: "https://personmeis397-glitch.github.io/Dinvaya---Day-studio/" };
            require("fs").writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));
          '
          npx cap add android
          npx cap sync android

      - name: Add permissions, app icon and notification icon
        run: |
          cd app/android/app/src/main
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application#' AndroidManifest.xml
          sed -i 's#</application>#<service android:name="com.dinvaya.daystudio.RingService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>\n        <activity android:name="com.dinvaya.daystudio.RingActivity" android:exported="false" android:showWhenLocked="true" android:turnScreenOn="true" android:excludeFromRecents="true" android:launchMode="singleTask" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"/>\n    </application>#' AndroidManifest.xml

          mkdir -p res/drawable
          cat > res/drawable/ic_stat_dinvaya.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M12,2l2.9,6.9L22,9.6l-5.5,4.8L18.2,22L12,18.3L5.8,22l1.7,-7.6L2,9.6l7.1,-0.7z"/>
          </vector>
          XML

          if [ -f "$GITHUB_WORKSPACE/icon-512.png" ]; then
            command -v convert >/dev/null || sudo apt-get install -y imagemagick
            rm -f res/mipmap-anydpi-v26/*.xml
            for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d="${pair%%:*}"; s="${pair##*:}"
              convert "$GITHUB_WORKSPACE/icon-512.png" -resize "${s}x${s}" "res/mipmap-$d/ic_launcher.png"
              cp "res/mipmap-$d/ic_launcher.png" "res/mipmap-$d/ic_launcher_round.png"
              rm -f "res/mipmap-$d/ic_launcher_foreground.png"
            done
          fi   
      - name: Make the reminder ringtones (same melodies as your app)
        run: |
          python3 - app/android/app/src/main/res/raw <<'PY'
          import math, struct, wave, os, sys
          out = sys.argv[1]
          os.makedirs(out, exist_ok=True)
          SR = 24000
          def wave_fn(kind, ph):
              x = ph % 1.0
              if kind == "sine": return math.sin(2 * math.pi * x)
              if kind == "square": return 1.0 if x < 0.5 else -1.0
              return 4 * abs(x - 0.5) - 1          # triangle
          # [pattern seconds, notes (freq, start, dur, type, gain), total seconds], copied from the app
          S = {
           "sunrise": [2.4, [(f, t, .55, "triangle", .5) for f, t in [(784,0),(988,.14),(1175,.28),(1568,.42),(1175,.7),(1568,.84),(1976,.98),(1568,1.4),(1976,1.54),(2349,1.68)]]
                           + [(2*f, t, .35, "sine", .18) for f, t in [(784,0),(988,.14),(1175,.28),(1568,.42),(1175,.7),(1568,.84),(1976,.98),(1568,1.4),(1976,1.54),(2349,1.68)]]
                           + [(f/2, t, .5, "sine", .22) for f, t in [(784,0),(988,.14),(1175,.28),(1568,.42),(1175,.7),(1568,.84),(1976,.98),(1568,1.4),(1976,1.54),(2349,1.68)]], 30],
           "cheer": [2.5, [(f, t, .4, "triangle", .22) for f, t in [(523.25,0),(659.25,.15),(783.99,.3),(1046.5,.45),(783.99,.78),(1046.5,.93),(1318.5,1.08),(1046.5,1.45),(1318.5,1.6),(1568,1.78)]]
                          + [(2*f, t, .25, "sine", .05) for f, t in [(523.25,0),(659.25,.15),(783.99,.3),(1046.5,.45),(783.99,.78),(1046.5,.93),(1318.5,1.08),(1046.5,1.45),(1318.5,1.6),(1568,1.78)]], 10],
           "chime": [2, [(f, .18*i, .9, "sine", .28) for i, f in enumerate([880, 1318.5, 1760])], 10],
           "bell": [2.5, [(660,0,1.8,"sine",.3),(1320,0,1.2,"sine",.15),(1980,0,.8,"sine",.08),(660,.9,1.6,"sine",.25)], 10],
           "soft": [2, [(f, .22*i, .7, "triangle", .25) for i, f in enumerate([523.25, 659.25, 783.99, 1046.5])], 10],
           "sparkle": [2, [(f, .1*i, .5, "triangle", .18) for i, f in enumerate([1046.5, 1318.5, 1568, 2093, 1568, 2637])], 10],
           "beep": [1, [(880, t, .15, "square", .12) for t in (0, .25, .5)], 10],
          }
          def render(name, pattern, notes, total):
              n = int(total * SR)
              buf = [0.0] * n
              reps = max(1, int(total // pattern))
              for r in range(reps):
                  for f, st, dur, kind, gain in notes:
                      start = int((r * pattern + st) * SR)
                      length = int((dur + 0.05) * SR)
                      a_end = 0.02
                      for i in range(length):
                          j = start + i
                          if j >= n: break
                          t = i / SR
                          if t < a_end: env = 1e-4 * (gain / 1e-4) ** (t / a_end)
                          elif t < dur: env = gain * (1e-4 / gain) ** ((t - a_end) / (dur - a_end))
                          else: env = 0.0
                          buf[j] += env * wave_fn(kind, f * t)
              peak = max(abs(x) for x in buf) or 1
              scale = 0.9 / peak
              path = os.path.join(out, "ring_%s.wav" % name)
              with wave.open(path, "wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR)
                  w.writeframes(b"".join(struct.pack("<h", int(max(-1, min(1, x * scale)) * 32767)) for x in buf))
          for name, (pattern, notes, total) in S.items():
              render(name, pattern, notes, total)
          for name in list(S.keys()) + ["silent"]:
              with wave.open(os.path.join(out, "dv_%s.wav" % name), "wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000)
                  w.writeframes(b"\x00\x00" * 800)
          with wave.open(os.path.join(out, "ring_silent.wav"), "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000)
              w.writeframes(b"\x00\x00" * 4000)
          print("ringtones written to", out)
          PY

      - name: Make the reminder sound repeat until you open or swipe it away
        run: |
          F=$(find app/node_modules/@capacitor/local-notifications/android -name LocalNotificationManager.java | head -n 1)
          echo "Plugin file: $F"
          grep -n "\.notify(" "$F" || true
          cp "$F" "$F.orig"
          perl -0pi -e 's/(\w+)\.notify\(([^,;()]+(?:\(\))?),\s*(\w+)\);/$3.flags |= android.app.Notification.FLAG_INSISTENT; $1.notify($2, $3);/g' "$F"
          if grep -q FLAG_INSISTENT "$F"; then
            echo "Repeat-until-dismissed change applied"
          else
            echo "::warning::Could not apply the repeat-until-dismissed change; alerts will ring once"
          fi
      - name: Alarm part 1 - the ringing service
        run: |
          J=app/android/app/src/main/java/com/dinvaya/daystudio
          mkdir -p "$J"
          cat > "$J/RingService.java" <<'JAVA'
          package com.dinvaya.daystudio;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.res.AssetFileDescriptor;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;

          public class RingService extends Service {
              public static final String STOP = "com.dinvaya.daystudio.STOP";
              public static final String STOPPED = "com.dinvaya.daystudio.RING_STOPPED";
              static final String CH = "dv_ring_alarm";
              MediaPlayer mp;
              Vibrator vib;
              PowerManager.WakeLock wl;
              Handler h = new Handler(Looper.getMainLooper());
              Runnable cap = new Runnable() { public void run() { stopRing(); } };

              /** Called from the notification plugin the moment a reminder fires. */
              public static void fromIntent(Context c, Intent in) {
                  Bundle ex = in.getExtras();
                  if (ex == null) return;
                  Notification n = null;
                  for (String k : ex.keySet()) {
                      Object o = ex.get(k);
                      if (o instanceof Notification) { n = (Notification) o; break; }
                  }
                  if (n == null) return;
                  String ch = n.getChannelId();
                  if (ch == null || !ch.startsWith("dv-") || ch.equals("dv-silent")) return;
                  Intent s = new Intent(c, RingService.class);
                  s.putExtra("snd", ch.substring(3));
                  CharSequence t = n.extras.getCharSequence(Notification.EXTRA_TITLE);
                  CharSequence x = n.extras.getCharSequence(Notification.EXTRA_TEXT);
                  s.putExtra("title", t == null ? "Reminder" : t.toString());
                  s.putExtra("text", x == null ? "" : x.toString());
                  if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(s); else c.startService(s);
              }

              @Override public IBinder onBind(Intent i) { return null; }

              @Override public int onStartCommand(Intent in, int flags, int startId) {
                  if (in == null || STOP.equals(in.getAction())) { stopRing(); return START_NOT_STICKY; }
                  String snd = in.getStringExtra("snd");
                  String title = in.getStringExtra("title");
                  String text = in.getStringExtra("text");
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel c = new NotificationChannel(CH, "Ringing alarm", NotificationManager.IMPORTANCE_HIGH);
                      c.setSound(null, null);
                      c.enableVibration(false);
                      c.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(c);
                  }
                  int fl = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0);
                  Intent ra = new Intent(this, RingActivity.class);
                  ra.putExtra("title", title);
                  ra.putExtra("text", text);
                  ra.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pa = PendingIntent.getActivity(this, 1, ra, fl);
                  Intent st = new Intent(this, RingService.class);
                  st.setAction(STOP);
                  PendingIntent ps = PendingIntent.getService(this, 2, st, fl);
                  int icon = getResources().getIdentifier("ic_stat_dinvaya", "drawable", getPackageName());
                  if (icon == 0) icon = android.R.drawable.ic_lock_idle_alarm;
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CH) : new Notification.Builder(this);
                  b.setSmallIcon(icon).setContentTitle(title).setContentText(text)
                   .setCategory(Notification.CATEGORY_ALARM).setOngoing(true)
                   .setContentIntent(pa).setFullScreenIntent(pa, true)
                   .setVisibility(Notification.VISIBILITY_PUBLIC)
                   .addAction(new Notification.Action.Builder(icon, "STOP", ps).build());
                  if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_MAX);
                  Notification n = b.build();
                  if (Build.VERSION.SDK_INT >= 29) startForeground(7001, n, 2 /* FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK */);
                  else startForeground(7001, n);
                  startRing(snd);
                  return START_NOT_STICKY;
              }

              void startRing(String snd) {
                  releaseAll();
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "dinvaya:ring");
                      wl.acquire(31 * 60 * 1000L);
                  } catch (Throwable t) {}
                  try {
                      AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                      int max = am.getStreamMaxVolume(AudioManager.STREAM_ALARM);
                      if (am.getStreamVolume(AudioManager.STREAM_ALARM) < max * 7 / 10) am.setStreamVolume(AudioManager.STREAM_ALARM, max * 7 / 10, 0);
                  } catch (Throwable t) {}
                  try {
                      int res = getResources().getIdentifier("ring_" + snd, "raw", getPackageName());
                      if (res == 0) res = getResources().getIdentifier("ring_chime", "raw", getPackageName());
                      AssetFileDescriptor afd = getResources().openRawResourceFd(res);
                      mp = new MediaPlayer();
                      mp.setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                      mp.setDataSource(afd.getFileDescriptor(), afd.getStartOffset(), afd.getLength());
                      afd.close();
                      mp.setLooping(true);
                      mp.prepare();
                      mp.start();
                  } catch (Throwable t) {}
                  try {
                      vib = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                      long[] p = new long[]{0, 700, 500};
                      if (Build.VERSION.SDK_INT >= 26) vib.vibrate(VibrationEffect.createWaveform(p, 0)); else vib.vibrate(p, 0);
                  } catch (Throwable t) {}
                  h.removeCallbacks(cap);
                  h.postDelayed(cap, 30 * 60 * 1000L); // safety: stop by itself after 30 minutes
              }

              void releaseAll() {
                  try { if (mp != null) { mp.stop(); mp.release(); } } catch (Throwable t) {}
                  mp = null;
                  try { if (vib != null) vib.cancel(); } catch (Throwable t) {}
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Throwable t) {}
              }

              void stopRing() {
                  h.removeCallbacks(cap);
                  releaseAll();
                  try { stopForeground(true); } catch (Throwable t) {}
                  try { ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).cancelAll(); } catch (Throwable t) {}
                  try { Intent i = new Intent(STOPPED); i.setPackage(getPackageName()); sendBroadcast(i); } catch (Throwable t) {}
                  stopSelf();
              }

              @Override public void onDestroy() { releaseAll(); super.onDestroy(); }
          }

          JAVA
      - name: Alarm part 2 - the Stop screen
        run: |
          J=app/android/app/src/main/java/com/dinvaya/daystudio
          cat > "$J/RingActivity.java" <<'JAVA'
          package com.dinvaya.daystudio;

          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class RingActivity extends Activity {
              BroadcastReceiver rcv;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true); }
                  else getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  String title = getIntent().getStringExtra("title");
                  String text = getIntent().getStringExtra("text");
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setGravity(Gravity.CENTER);
                  l.setBackgroundColor(Color.parseColor("#2A0A1A"));
                  l.setPadding(60, 60, 60, 60);
                  l.addView(tv("Dinvaya reminder", 18, "#F3A6C8", false));
                  l.addView(tv(title == null ? "Reminder" : title, 32, "#FFFFFF", true));
                  if (text != null && text.length() > 0) l.addView(tv(text, 18, "#E8D5DE", false));
                  Button stop = new Button(this);
                  stop.setText("STOP");
                  stop.setTextSize(28);
                  stop.setTextColor(Color.WHITE);
                  stop.setTypeface(Typeface.DEFAULT_BOLD);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(Color.parseColor("#C2185B"));
                  g.setCornerRadius(120);
                  stop.setBackground(g);
                  stop.setPadding(40, 60, 40, 60);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = 120;
                  stop.setLayoutParams(lp);
                  stop.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { stopRing(false); } });
                  l.addView(stop);
                  Button open = new Button(this);
                  open.setText("Stop and open Dinvaya");
                  open.setAllCaps(false);
                  open.setTextSize(16);
                  LinearLayout.LayoutParams lp2 = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp2.topMargin = 40;
                  open.setLayoutParams(lp2);
                  open.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { stopRing(true); } });
                  l.addView(open);
                  setContentView(l);
                  rcv = new BroadcastReceiver() { public void onReceive(Context c, Intent i) { finish(); } };
                  IntentFilter f = new IntentFilter(RingService.STOPPED);
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(rcv, f, Context.RECEIVER_NOT_EXPORTED); else registerReceiver(rcv, f);
              }

              TextView tv(String s, int sp, String col, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(Color.parseColor(col));
                  t.setGravity(Gravity.CENTER);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setPadding(0, 16, 0, 16);
                  return t;
              }

              void stopRing(boolean open) {
                  Intent st = new Intent(this, RingService.class);
                  st.setAction(RingService.STOP);
                  startService(st);
                  if (open) {
                      Intent m = getPackageManager().getLaunchIntentForPackage(getPackageName());
                      if (m != null) startActivity(m);
                  }
                  finish();
              }

              @Override protected void onDestroy() {
                  try { if (rcv != null) unregisterReceiver(rcv); } catch (Throwable t) {}
                  super.onDestroy();
              }
          }

          JAVA
      - name: Alarm part 3 - connect it to your reminders
        run: |
          F=$(find app/node_modules/@capacitor/local-notifications/android -name TimedNotificationPublisher.java | head -n 1)
          echo "Publisher file: $F"
          cp "$F" "$F.orig"
          perl -0pi -e 's/(public\s+void\s+onReceive\s*\(\s*Context\s+(\w+)\s*,\s*Intent\s+(\w+)\s*\)\s*\{)/$1\n        try { Class.forName("com.dinvaya.daystudio.RingService").getMethod("fromIntent", android.content.Context.class, android.content.Intent.class).invoke(null, $2, $3); } catch (Throwable dvT) {}\n/' "$F"
          if grep -q RingService "$F"; then
            echo "Alarm service hooked in"
          else
            echo "::warning::Could not hook the alarm service; reminders will use the normal notification sound"
          fi

      - name: Build the APK
        run: |
          cd app/android
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            echo "::warning::Build failed with the new alarm, building the previous version instead"
            F=$(find ../node_modules/@capacitor/local-notifications/android -name TimedNotificationPublisher.java | head -n 1)
            cp "$F.orig" "$F"
            rm -f app/src/main/java/com/dinvaya/daystudio/RingService.java app/src/main/java/com/dinvaya/daystudio/RingActivity.java
            for s in sunrise cheer chime bell soft sparkle beep; do cp "app/src/main/res/raw/ring_$s.wav" "app/src/main/res/raw/dv_$s.wav"; done
            F2=$(find ../node_modules/@capacitor/local-notifications/android -name LocalNotificationManager.java | head -n 1)
            cp "$F2.orig" "$F2"
            ./gradlew assembleDebug --no-daemon
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Dinvaya.apk"

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Dinvaya.apk \
            --title "Dinvaya APK build ${{ github.run_number }} ($MODE)" \
            --notes "Android app with a real alarm: rings until you press Stop, even when the app is closed. Mode: $MODE."

      - name: Build signed release APK for Amazon
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd app/android
          sed -i -E "s/versionCode [0-9]+/versionCode $((100 + ${{ github.run_number }}))/" app/build.gradle
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dinvaya.jks"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/dinvaya.jks" --ks-key-alias dinvaya --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out "$GITHUB_WORKSPACE/Dinvaya-release.apk" "$RUNNER_TEMP/aligned.apk"
          cd "$GITHUB_WORKSPACE"
          gh release upload "apk-${{ github.run_number }}" Dinvaya-release.apk
